# Deploy from main as a Render Blueprint. No local API key is uploaded.
services:
  - type: web
    name: photogrid
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements-hosted.txt
    # Job state is in memory: one worker, with threads for polling while working.
    startCommand: gunicorn 'roofready_app:create_app()' --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: PHOTOGRID_OUTPUT_ROOT
        value: /tmp/photogrid-outputs
      # The free plan has 512 MB; going over restarts the service and clears every search.
      # A 1,400-pixel analysis grid (0.14 m pixels for a 100 m search) halves a search's peak
      # memory. GDAL's cache and OpenBLAS threads otherwise size themselves for the host machine.
      - key: PHOTOGRID_MAX_GRID_PIXELS
        value: "1400"
      - key: GDAL_CACHEMAX
        value: "64"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Secrets: Render asks for these when the Blueprint is first created, never
      # stores them in this file, and later syncs leave them alone. Add or change
      # them on the service's Environment page.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: photogrid
